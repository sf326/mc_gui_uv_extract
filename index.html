<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>UV拾取器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:system-ui}
#main{display:flex;height:100%}
#canvasWrap{flex:1;overflow:hidden;background:#222;position:relative}
#cv{position:absolute;cursor:crosshair;image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges}
#panel{width:640px;padding:12px;background:#1a1a1a;color:#fff;display:flex;flex-direction:column;height:100vh}
#out{white-space:pre-wrap;background:#000;color:#0f0;padding:10px;margin-top:8px;font-size:12px;flex:1;overflow:auto}
#tip{font-size:12px;color:#ffd700;margin:4px 0}
#coordTip{font-size:12px;color:#8cf;margin:4px 0}
.btns{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
#historyList{background:#222;padding:6px;margin:6px 0;max-height:140px;overflow:auto;font-size:11px}
#historyList div{padding:3px 4px;cursor:pointer;border-bottom:#333 solid 1px}
#historyList div:hover{background:#383838}
button{padding:6px 8px;cursor:pointer}
.info{font-size:12px;color:#aaa;margin:6px 0}
</style>
</head>
<body>
<div id="main">
  <div id="canvasWrap">
    <canvas id="cv"></canvas>
  </div>
  <div id="panel">
    <input type="file" id="imgFile" accept="image/*">
    <div class="info">
操作：左键单击放置方块锚点<br>
单击路径首顶点 → 闭合多边形<br>
按住Alt + 鼠标拖拽顶点 修改顶点位置<br>
按住空格 + 拖拽画布平移视图
    </div>
    <div id="tip"></div>
    <div id="coordTip"></div>
    <div class="btns">
      <button onclick="undo()">撤销上一步</button>
      <button onclick="undoAll()">全部清空</button>
      <button onclick="copyResult()">复制全部UV信息</button>
    </div>
    <div>历史快照列表（点击跳回该状态）：</div>
    <div id="historyList"></div>
    <div id="out"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById("canvasWrap");
canvas.width = wrap.clientWidth;
canvas.height = wrap.clientHeight;
ctx.imageSmoothingEnabled = false;
ctx.webkitImageSmoothingEnabled = false;
ctx.msImageSmoothingEnabled = false;

let img = null;
let imgW = 0, imgH = 0;
let scale = 4;
let viewX = 0, viewY = 0;
let dragView = false;
let dragViewStart = {x:0,y:0};
let mouseTex = {x:0,y:0};
let spaceDown = false;
let altDown = false;

let historyStack = [];
let currentPath = [];
let shapes = [];
let dragPointIdx = null;
const pointSize = 4;
const hitRange = 12;
const dragThreshold = 4;
let mouseDownStart = {x:0,y:0};

function saveHistory(){
  historyStack.push({
    shapes: JSON.parse(JSON.stringify(shapes)),
    currentPath: JSON.parse(JSON.stringify(currentPath))
  });
  if(historyStack.length>30) historyStack.shift();
  renderHistoryList();
}

function jumpToHistory(idx){
  const snap = historyStack[idx];
  shapes = JSON.parse(JSON.stringify(snap.shapes));
  currentPath = JSON.parse(JSON.stringify(snap.currentPath));
  historyStack = historyStack.slice(0, idx+1);
  renderHistoryList();
  redraw();
}

function undo(){
  if(historyStack.length===0) return;
  historyStack.pop();
  renderHistoryList();
  if(historyStack.length>0){
    const last = historyStack[historyStack.length-1];
    shapes = JSON.parse(JSON.stringify(last.shapes));
    currentPath = JSON.parse(JSON.stringify(last.currentPath));
  }else{
    shapes=[];currentPath=[];
  }
  redraw();
}
function undoAll(){
  saveHistory();
  shapes = [];
  currentPath = [];
  redraw();
}

function renderHistoryList(){
  const el = document.getElementById("historyList");
  el.innerHTML = "";
  historyStack.forEach((snap,i)=>{
    const div = document.createElement("div");
    const pathCnt = snap.currentPath.length;
    const shapeCnt = snap.shapes.length;
    div.textContent = `快照${i+1}: 已闭合选区${shapeCnt}，绘制顶点${pathCnt}`;
    div.onclick = ()=>jumpToHistory(i);
    el.appendChild(div);
  })
}

function screen2tex(sx,sy){
  const tx = Math.round((sx - viewX)/scale);
  const ty = Math.round((sy - viewY)/scale);
  return {x:tx,y:ty};
}
function tex2screen(tx,ty){
  return {
    x: tx*scale + viewX,
    y: ty*scale + viewY
  }
}

function drawRectPoint(sx,sy,color="#fff"){
  ctx.fillStyle = color;
  ctx.fillRect(sx-pointSize, sy-pointSize, pointSize*2, pointSize*2);
}

function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!img) return;
  ctx.save();
  ctx.translate(viewX, viewY);
  ctx.scale(scale,scale);
  ctx.drawImage(img,0,0);
  ctx.restore();

  for(const shp of shapes){
    ctx.strokeStyle="#0ff"; ctx.lineWidth=2;
    ctx.beginPath();
    const pts = shp.points.map(p=>tex2screen(p.x,p.y));
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.stroke();
    ctx.fillStyle = "rgba(0,255,255,0.12)";
    ctx.fill();
    for(const p of pts){
      drawRectPoint(p.x,p.y,"#ffffff");
    }
  }

  if(currentPath.length>0){
    ctx.strokeStyle="#ff0"; ctx.lineWidth=2;
    ctx.beginPath();
    const pts = currentPath.map(p=>tex2screen(p.x,p.y));
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    const lastPt = pts[pts.length-1];
    const mPos = tex2screen(mouseTex.x, mouseTex.y);
    ctx.beginPath();
    ctx.moveTo(lastPt.x, lastPt.y);
    ctx.lineTo(mPos.x, mPos.y);
    ctx.strokeStyle="#ff6600";
    ctx.stroke();
    for(const p of pts){
      drawRectPoint(p.x,p.y,"#ffff00");
    }
  }

  updateOutput();
  updateTip();
}

function calcBounds(points){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const p of points){
    minX=Math.min(minX,p.x);
    minY=Math.min(minY,p.y);
    maxX=Math.max(maxX,p.x);
    maxY=Math.max(maxY,p.y);
  }
  return {
    u:minX,
    v:minY,
    w:maxX-minX,
    h:maxY-minY,
    u2:maxX,
    v2:maxY
  }
}

function updateTip(){
  const tipEl = document.getElementById("tip");
  const coordEl = document.getElementById("coordTip");
  if(currentPath.length === 0){
    tipEl.textContent = "准备绘制：点击图片放置第一个顶点";
    coordEl.textContent = "";
  }else{
    tipEl.textContent = `正在绘制，顶点数：${currentPath.length}，单击首顶点方块闭合多边形`;
    const last = currentPath[currentPath.length-1];
    coordEl.textContent = `最后顶点像素坐标：X=${last.x}, Y=${last.y}`;
  }
}

function updateOutput(){
  let txt = "UV详细信息 \n贴图尺寸："+imgW+" × "+imgH+"\n\n";
  for(let idx=0; idx<shapes.length; idx++){
    const shp = shapes[idx];
    const b = shp.bounds;
    const nu = b.u/imgW;
    const nv = b.v/imgH;
    const nu2 = b.u2/imgW;
    const nv2 = b.v2/imgH;
    txt += "【选区 "+(idx+1)+"】\n";
    txt += "多边形顶点(像素，包含箭头全部转角)：";
    const ptList = shp.points.map(p=>`(${p.x},${p.y})`);
    txt += ptList.join(" , ")+"\n";
    txt += `像素包围盒：u=${b.u}, v=${b.v}, w=${b.w}, h=${b.h}\n`;
    txt += `包围盒对角像素：左上(${b.u},${b.v})，右下(${b.u2},${b.v2})\n`;
    txt += `MC归一包围盒UV：[${nu.toFixed(4)},${nv.toFixed(4)},${nu2.toFixed(4)},${nv2.toFixed(4)}]\n`;
    txt += "多边形顶点【归一UV坐标】：";
    const ptNormList = shp.points.map(p=>`(${(p.x/imgW).toFixed(4)},${(p.y/imgH).toFixed(4)})`);
    txt += ptNormList.join(" , ")+"\n";
    txt += "--------------------------------------------------------\n";
  }
  document.getElementById('out').innerText = txt;
}

canvas.onmousedown = e=>{
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left;
  const my = e.clientY - r.top;
  mouseDownStart = {x:mx,y:my};
  const texPos = screen2tex(mx,my);

  if(spaceDown){
    dragView=true;
    dragViewStart={x:mx,y:my};
    return;
  }

  //Alt按下，才允许拾取顶点拖拽
  if(altDown){
    for(let s of shapes){
      for(let i=0;i<s.points.length;i++){
        const sp = tex2screen(s.points[i].x, s.points[i].y);
        const dist = Math.hypot(sp.x-mx, sp.y-my);
        if(dist < hitRange){
          dragPointIdx = {shape:shapes.indexOf(s), pt:i};
          return;
        }
      }
    }
    for(let i=0;i<currentPath.length;i++){
      const sp = tex2screen(currentPath[i].x, currentPath[i].y);
      const dist = Math.hypot(sp.x-mx, sp.y-my);
      if(dist < hitRange){
        dragPointIdx = {path:true, pt:i};
        return;
      }
    }
  }
}

canvas.onmousemove = e=>{
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left;
  const my = e.clientY - r.top;
  mouseTex = screen2tex(mx,my);

  if(dragView){
    viewX += mx - dragViewStart.x;
    viewY += my - dragViewStart.y;
    dragViewStart={x:mx,y:my};
    redraw();
    return;
  }
  if(dragPointIdx!==null){
    const t = screen2tex(mx,my);
    if(dragPointIdx.path){
      currentPath[dragPointIdx.pt] = {x:t.x,y:t.y};
    }else{
      shapes[dragPointIdx.shape].points[dragPointIdx.pt]={x:t.x,y:t.y};
      shapes[dragPointIdx.shape].bounds = calcBounds(shapes[dragPointIdx.shape].points);
    }
    redraw();
  }else{
    redraw();
  }
}

canvas.onmouseup = e=>{
  if(dragView){
    dragView=false;
    return;
  }
  if(dragPointIdx){
    dragPointIdx=null;
    return;
  }
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left;
  const my = e.clientY - r.top;
  const dx = mx - mouseDownStart.x;
  const dy = my - mouseDownStart.y;
  //移动超过阈值，判定为拖动，不执行点击
  if(Math.sqrt(dx*dx + dy*dy) > dragThreshold){
    return;
  }
  const texPos = screen2tex(mx,my);

  //单击首顶点闭合
  if(currentPath.length >=3){
    const firstScreen = tex2screen(currentPath[0].x, currentPath[0].y);
    const d = Math.hypot(firstScreen.x - mx, firstScreen.y - my);
    if(d < hitRange){
      saveHistory();
      const b = calcBounds(currentPath);
      shapes.push({points:[...currentPath], bounds:b});
      currentPath = [];
      redraw();
      return;
    }
  }
  //普通单击添加顶点
  saveHistory();
  currentPath.push({x:texPos.x, y:texPos.y});
  redraw();
}

canvas.onwheel=e=>{
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left;
  const my = e.clientY - r.top;
  const before = screen2tex(mx,my);
  if(e.deltaY<0) scale *=1.1;
  else scale /=1.1;
  scale = Math.max(0.5, Math.min(scale, 20));
  const after = tex2screen(before.x, before.y);
  viewX += mx - after.x;
  viewY += my - after.y;
  redraw();
}

document.addEventListener('keydown',e=>{
  if(e.code === "Space"){
    spaceDown = true;
    canvas.style.cursor="grab";
  }
  if(e.code === "AltLeft" || e.code === "AltRight"){
    altDown = true;
    canvas.style.cursor="move";
  }
})
document.addEventListener('keyup',e=>{
  if(e.code === "Space"){
    spaceDown = false;
    canvas.style.cursor="crosshair";
  }
  if(e.code === "AltLeft" || e.code === "AltRight"){
    altDown = false;
    canvas.style.cursor="crosshair";
  }
})

function copyResult(){
  const t = document.getElementById('out').innerText;
  navigator.clipboard.writeText(t).then(()=>alert("全部UV信息复制成功"))
}

document.getElementById('imgFile').onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const i=new Image();
    i.onload=()=>{
      img=i;
      imgW=i.width;
      imgH=i.height;
      viewX = (wrap.clientWidth/2) - (imgW*scale/2);
      viewY = (wrap.clientHeight/2) - (imgH*scale/2);
      shapes=[];
      currentPath=[];
      historyStack=[];
      renderHistoryList();
      redraw();
    }
    i.src=ev.target.result;
  }
  reader.readAsDataURL(f);
}
window.addEventListener('resize',()=>{
  canvas.width=wrap.clientWidth; canvas.height=wrap.clientHeight; redraw();
})
</script>
</body>
</html>
